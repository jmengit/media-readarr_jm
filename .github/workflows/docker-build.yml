name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +%Y.%m.%d)-${GITHUB_SHA::7}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build Frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build --env production

      - name: Build Backend (linux-x64)
        run: |
          dotnet publish src/Readarr.sln \
            -c Release \
            -r linux-musl-x64 \
            --self-contained \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -o ./artifacts/linux-x64

      - name: Build Backend (linux-arm64)
        run: |
          dotnet publish src/Readarr.sln \
            -c Release \
            -r linux-musl-arm64 \
            --self-contained \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -o ./artifacts/linux-arm64

      - name: Copy frontend to artifacts
        run: |
          cp -r frontend/build/* ./artifacts/linux-x64/UI/ || mkdir -p ./artifacts/linux-x64/UI && cp -r frontend/build/* ./artifacts/linux-x64/UI/
          cp -r frontend/build/* ./artifacts/linux-arm64/UI/ || mkdir -p ./artifacts/linux-arm64/UI && cp -r frontend/build/* ./artifacts/linux-arm64/UI/

      - name: Create package info
        run: |
          echo -e "UpdateMethod=docker\nBranch=${{ github.ref_name }}\nPackageVersion=${{ steps.version.outputs.version }}\nPackageAuthor=[jmengit](https://github.com/jmengit)" > ./artifacts/linux-x64/package_info
          echo -e "UpdateMethod=docker\nBranch=${{ github.ref_name }}\nPackageVersion=${{ steps.version.outputs.version }}\nPackageAuthor=[jmengit](https://github.com/jmengit)" > ./artifacts/linux-arm64/package_info

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: readarr-linux-x64
          path: ./artifacts/linux-x64/
          retention-days: 1

      - name: Upload linux-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: readarr-linux-arm64
          path: ./artifacts/linux-arm64/
          retention-days: 1

  build-docker:
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            artifact: readarr-linux-x64
            dockerfile: Dockerfile
          - platform: linux/arm64
            artifact: readarr-linux-arm64
            dockerfile: Dockerfile.aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./docker/app/readarr/bin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Get platform tag
        id: platform
        run: |
          if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then
            echo "tag=amd64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.platform.outputs.tag }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.platform.outputs.tag }}" > /tmp/digests/${{ steps.platform.outputs.tag }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.tag }}
          path: /tmp/digests/*
          retention-days: 1

  merge-manifests:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push manifest
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            docker buildx imagetools create \
              -t $TAG \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64-${{ github.sha }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64-${{ github.sha }}
          done
