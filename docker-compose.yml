version: "3.8"

services:
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr-jm
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./readarr-config:/config
      - ./books:/books
      - ./downloads:/downloads
      - ./init-book-threshold.sh:/custom-cont-init.d/99-book-threshold.sh:ro
    ports:
      - 8787:8787
    restart: unless-stopped
